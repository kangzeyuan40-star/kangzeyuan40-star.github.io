  <p>这是一个在个人电脑上运行的工具。使用者通过 Google 授权查询自己的健康记录，并通过 Codex 记录自己指定的饮食和饮水。</p>
  <p>餐照可用于估算食物和营养。写入 Google Health 的是结构化记录。</p>
